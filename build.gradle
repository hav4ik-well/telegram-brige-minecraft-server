plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

version = '1.0.0'
group = 'com.example.telegrambridge'

repositories {
    mavenCentral()
    maven { 
        url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' 
    }
    maven { 
        url 'https://repo.papermc.io/repository/maven-public/' 
    }
    maven { 
        url 'https://jitpack.io' 
    }
    maven { 
        url 'https://libraries.minecraft.net/' 
    }
}

dependencies {
    // Используем Spigot API вместо Paper API (более стабильно для 1.16.5)
    compileOnly 'org.spigotmc:spigot-api:1.16.5-R0.1-SNAPSHOT'
    
    // Telegram бот
    implementation 'com.github.pengrad:java-telegram-bot-api:6.9.1'
    
    // HTTP клиент
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // Kotlin (если нужен для зависимостей)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}

shadowJar {
    relocate 'com.pengrad.telegrambot', 'com.example.telegrambridge.libs.telegrambot'
    relocate 'okhttp3', 'com.example.telegrambridge.libs.okhttp3'
    relocate 'okio', 'com.example.telegrambridge.libs.okio'
    relocate 'kotlin', 'com.example.telegrambridge.libs.kotlin'
    
    archiveFileName = "${project.name}-${project.version}.jar"
}

tasks.build.dependsOn shadowJar

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
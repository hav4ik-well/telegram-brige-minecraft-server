plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
    maven { url "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation 'com.github.pengrad:java-telegram-bot-api:6.9.1'
    include 'com.github.pengrad:java-telegram-bot-api:6.9.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    include 'com.squareup.okhttp3:okhttp:4.12.0'
    
    implementation 'com.squareup.okio:okio:3.6.0'
    include 'com.squareup.okio:okio:3.6.0'
    
    implementation 'com.google.code.gson:gson:2.10.1'
    include 'com.google.code.gson:gson:2.10.1'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    include 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24'
    include 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24'
    
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
    include 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
    
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    include 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }

}
